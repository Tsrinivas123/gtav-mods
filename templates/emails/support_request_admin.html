<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Support Request</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
      color: #333333;
    }
    .email-container {
      max-width: 600px;
      margin: 30px auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      border-top: 5px solid #ff6b00;
    }
    .header {
      background-color: #111111;
      padding: 20px;
      text-align: center;
      color: #ffffff;
    }
    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
    }
    .header span {
      color: #ff6b00;
    }
    .content {
      padding: 30px;
    }
    .title-banner {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff6b00;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f1f1;
      padding-bottom: 10px;
    }
    .field-group {
      margin-bottom: 15px;
    }
    .field-label {
      font-size: 0.85rem;
      color: #777777;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .field-value {
      font-size: 1rem;
      color: #111111;
    }
    .message-box {
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 15px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-top: 5px;
    }
    .btn-container {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 20px;
    }
    .btn-admin {
      background-color: #ff6b00;
      color: #ffffff !important;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.95rem;
      display: inline-block;
    }
    .footer {
      background-color: #f3f4f6;
      padding: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #777777;
      border-top: 1px solid #e5e7eb;
    }
    .footer a {
      color: #ff6b00;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">
      <h1>Pawan<span>Mod</span></h1>
    </div>
    <div class="content">
      <div class="title-banner">📩 NEW SUPPORT REQUEST</div>
      
      <div class="field-group">
        <div class="field-label">Ticket ID</div>
        <div class="field-value" style="font-weight: bold; font-size: 1.1rem; color: #ff6b00;">{{ ticket_id }}</div>
      </div>
      
      <div class="field-group">
        <div class="field-label">Customer</div>
        <div class="field-value">{{ full_name }}</div>
      </div>

      <div class="field-group">
        <div class="field-label">Email</div>
        <div class="field-value">{{ email }}</div>
      </div>

      <div class="field-group">
        <div class="field-label">Category</div>
        <div class="field-value">{{ category }}</div>
      </div>

      <div class="field-group">
        <div class="field-label">Subject</div>
        <div class="field-value">{{ subject }}</div>
      </div>

      <div class="field-group">
        <div class="field-label">Message</div>
        <div class="message-box">{{ message }}</div>
      </div>

      <div class="field-group" style="margin-top: 20px;">
        <div class="field-label">Submitted</div>
        <div class="field-value" style="font-size: 0.9rem; color: #555555;">{{ created_at }}</div>
      </div>

      <div class="btn-container">
        <a href="{{ admin_url }}" class="btn-admin" target="_blank">Open Django Admin</a>
      </div>
    </div>
    <div class="footer">
      This email was automatically generated by PawanMod.
    </div>
  </div>
</body>
</html>
