{% extends "base.html" %}
{% block title %}Server Error (500) | PawanMod Premium GTA Mods{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <div style="background: rgba(26, 29, 39, 0.8); border: 1px solid rgba(255, 71, 87, 0.2); border-radius: 16px; padding: 48px; max-width: 550px; backdrop-filter: blur(10px);">
        <div style="font-size: 3.5rem; color: #ff4757; margin-bottom: 16px;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: #ffffff; margin-bottom: 12px;">500 - Server Error</h1>
        <p style="color: #a4b0be; font-size: 1.05rem; line-height: 1.6; margin-bottom: 28px;">
            We encountered a temporary server error. Please try refreshing the page or head back to the marketplace.
        </p>
        <a href="{% url 'marketplace:home' %}" class="btn btn-primary" style="background: #ff4757; border: none; padding: 12px 32px; border-radius: 8px; font-weight: 700; font-size: 1rem; transition: background 0.2s;">
            <i class="fa-solid fa-house"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
