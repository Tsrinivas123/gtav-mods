<div class="mod-card" id="productCard-{{ product.id }}">
  <a href="{% url 'marketplace:product_detail' product.slug %}" class="mod-card-link" title="{{ product.name }}">
    <div class="mod-img-wrapper">
      {% if product.main_image and product.main_image.name %}
      <img src="{{ product.main_image.url }}" alt="{{ product.name }}" loading="lazy">
      {% else %}
      <div class="fallback-img"
        style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: var(--color-text-muted, #9ca3af);">
        <i class="fa-solid fa-image fa-2x"></i>
      </div>
      {% endif %}
    </div>

    <div class="mod-info">
      <span class="mod-category-label">{{ product.category.name|upper|default:"ALL MODS" }}</span>
      <h3 class="mod-name">{{ product.name }}</h3>

      <div class="mod-price-box">
        {% if product.price == 0 %}
        <span class="mod-price free">FREE</span>
        {% else %}
        {% if product.old_price %}
        <span class="mod-old-price">₹{{ product.old_price }}</span>
        {% endif %}
        <span class="mod-price">₹{{ product.price }}</span>
        {% endif %}
      </div>
    </div>
  </a>
</div>
